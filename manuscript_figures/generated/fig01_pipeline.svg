   <g id="text_1">
    <text style="font-weight: 700; font-size: 6.2px; font-family: 'DejaVu Sans'; text-anchor: middle" x="53.545248" y="27.933191" transform="rotate(-0 53.545248 27.933191)">1  Resting-state EEG</text>
   </g>
   <g id="text_2">
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'" transform="translate(22.856373 45.46165)">OpenNeuro ds004504</text>
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'" transform="translate(22.880436 53.278462)">19 electrodes, 500 Hz</text>
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'" transform="translate(37.103998 60.58165)">eyes closed</text>
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'" transform="translate(22.926373 68.349025)">AD n = 36, HC n = 29</text>
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'" transform="translate(12.708561 75.70165)">provider: 0.5-45 Hz, ASR, ICA</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 6.2px; font-family: 'DejaVu Sans'; text-anchor: middle" x="155.424888" y="27.933191" transform="rotate(-0 155.424888 27.933191)">2  Segmentation</text>
   </g>
   <g id="text_4">
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'" transform="translate(121.276701 45.46165)">split at boundary events</text>
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'" transform="translate(118.112263 53.02165)">250 Hz, average reference</text>
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'" transform="translate(123.685576 60.58165)">10 s windows, 1 s step</text>
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'" transform="translate(120.937201 68.354712)">5 min selected (mode B)</text>
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'" transform="translate(119.999201 76.24415)">mode A: first 10 windows</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 6.2px; font-family: 'DejaVu Sans'; text-anchor: middle" x="257.304528" y="27.933191" transform="rotate(-0 257.304528 27.933191)">3  Source reconstruction</text>
   </g>
   <g id="text_6">
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'" transform="translate(217.040091 49.24165)">fsaverage ico-5, 3-layer BEM</text>
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'" transform="translate(225.638716 56.80165)">LCMV (per participant)</text>
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'" transform="translate(221.989528 64.36165)">or depth-weighted wMNE</text>
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'" transform="translate(224.285091 71.872212)">68 x 19 ROI operator W</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 6.2px; font-family: 'DejaVu Sans'; text-anchor: middle" x="359.184168" y="27.933191" transform="rotate(-0 359.184168 27.933191)">4  Atlas aggregation</text>
   </g>
   <g id="text_8">
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'" transform="translate(326.222481 49.78415)">dk68 -&gt; r18 -&gt; lobes12</text>
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'" transform="translate(332.31948 57.34415)">unions of DK labels</text>
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'" transform="translate(323.410668 64.90415)">label-blind resolution rule</text>
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'" transform="translate(326.236918 72.46415)">recorded atlas: lobes12</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 6.2px; font-family: 'DejaVu Sans'; text-anchor: middle" x="359.184168" y="110.871431" transform="rotate(-0 359.184168 110.871431)">5  Features per window</text>
   </g>
   <g id="text_10">
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'" transform="translate(322.728606 132.17989)">5 bands (delta ... gamma)</text>
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'" transform="translate(324.962043 139.674265)">PLV (or |ciPLV|) per band</text>
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'" transform="translate(332.987543 147.29989)">PSD (log, relative),</text>
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'" transform="translate(333.808293 154.85989)">DE, node strength</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 6.2px; font-family: 'DejaVu Sans'; text-anchor: middle" x="257.304528" y="110.871431" transform="rotate(-0 257.304528 110.871431)">6  Weighted graphs</text>
   </g>
   <g id="text_12">
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'" transform="translate(229.530716 132.17989)">one graph per band</text>
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'" transform="translate(232.85134 139.662015)">A_func,b: 12 x 12</text>
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'" transform="translate(241.765403 147.222015)">X_b: 12 x F</text>
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'" transform="translate(222.897778 154.782015)">fixed A_anat (contiguity)</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 6.2px; font-family: 'DejaVu Sans'; text-anchor: middle" x="155.424888" y="110.871431" transform="rotate(-0 155.424888 110.871431)">7  Graph network</text>
   </g>
   <g id="text_14">
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'" transform="translate(123.700013 132.17989)">Exp8a: dual-layer GCN</text>
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'" transform="translate(125.296013 139.73989)">Exp5: multiband GCN</text>
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'" transform="translate(130.228826 147.29989)">60 epochs, Adam,</text>
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'" transform="translate(130.977826 154.85989)">no early stopping</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 6.2px; font-family: 'DejaVu Sans'; text-anchor: middle" x="53.545248" y="110.871431" transform="rotate(-0 53.545248 110.871431)">8  Participant decision</text>
   </g>
   <g id="text_16">
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'" transform="translate(27.092686 132.17989)">window probability</text>
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'" transform="translate(25.498873 140.28239)">mean over windows</text>
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'" transform="translate(19.024748 147.622327)">threshold 0.5 -&gt; AD / HC</text>
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'" transform="translate(13.402436 154.85989)">5-fold participant CV, n = 52</text>
   </g>
   <g id="text_17">
    <text style="font-style: italic; font-size: 5.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #444444" x="206.964" y="190.04112" transform="rotate(-0 206.964 190.04112)">LCMV and wMNE differ only in step 3; all downstream code is identical. Classical baselines are outside the scope of this study.</text>
   </g>
  </g>
 </g>
