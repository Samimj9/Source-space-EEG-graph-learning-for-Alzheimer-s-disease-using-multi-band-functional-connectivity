    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'" transform="translate(49.163926 211.37845)">cortical-surface contiguity</text>
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'" transform="translate(60.639988 219.195262)">no data, no labels</text>
   </g>
   <g id="text_8">
