   </g>
   <g id="text_5">
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'" transform="translate(53.894176 137.06869)">[log PSD, relative PSD]</text>
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'" transform="translate(55.788113 144.62869)">(5, 12, 2) per window</text>
