   <g id="text_2">
    <text style="font-weight: 700; font-size: 6.2px; font-family: 'DejaVu Sans'; text-anchor: middle" x="85.712676" y="48.861791" transform="rotate(-0 85.712676 48.861791)">A_func,b</text>
   </g>
