[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "adgraph"
version = "0.1.0"
description = "Source-space EEG graph learning for Alzheimer's disease"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "pyyaml",
    "openpyxl",
    "mne>=1.6",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
gnn = ["torch>=2.2"]   # preinstalled in Colab
umap = ["umap-learn"]
test = ["pytest", "edfio==0.4.18"]   # suite must run with zero dependency skips

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
