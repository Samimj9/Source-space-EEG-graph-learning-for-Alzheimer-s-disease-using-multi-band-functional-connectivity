# Experiment 4: band-averaged source-space GNN (simple graph baseline for Experiment 5).
# A_mean = mean(A_theta, A_alpha1, A_alpha2, A_beta), separately for PLV and ciPLV.
# Node features: source PSD of all four bands.
extends: gnn_base.yaml
experiment: exp4_band_mean
graph:
  band_mode: mean
  bands: [theta, alpha1, alpha2, beta]
node_features:
  components: [psd]
  psd_kinds: [log, rel]
  psd_bands: all                 # adjacency is band-averaged, so nodes carry all four bands (F = 8)
sweep:
  graph.connectivity: [plv, ciplv]
