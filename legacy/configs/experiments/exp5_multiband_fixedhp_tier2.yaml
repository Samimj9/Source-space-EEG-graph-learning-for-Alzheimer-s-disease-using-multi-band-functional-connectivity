# Tier 2 (optional, secondary): the Experiment 5 variants not in Tier 1 (band-specific encoders with every
# fusion; shared encoder with concat / gate fusion). {PLV, |ciPLV|} x 6 = 12 variants; all settings.
extends: gnn_fixed_base.yaml
experiment: exp5_multiband_fixedhp_tier2
graph:
  band_mode: multi
  bands: [theta, alpha1, alpha2, beta]
node_features:
  components: [psd]
  psd_kinds: [log, rel]
  psd_bands: matched
sweep:
  graph.connectivity: [plv, ciplv]
variants:
  shared__concat: {model.shared_encoder: true, model.fusion: concat}
  shared__gate: {model.shared_encoder: true, model.fusion: gate}
  separate__mean: {model.shared_encoder: false, model.fusion: mean}
  separate__concat: {model.shared_encoder: false, model.fusion: concat}
  separate__gate: {model.shared_encoder: false, model.fusion: gate}
  separate__attention: {model.shared_encoder: false, model.fusion: attention}
