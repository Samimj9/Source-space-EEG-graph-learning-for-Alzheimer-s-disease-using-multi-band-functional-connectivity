# Age sensitivity analysis (DESIGN.md §5): EEG + age version of exp3_conn_psd.
# Age is standardized with training-subject statistics inside each fold; classical models
# append it to the EEG feature vector, GNNs concatenate it to the pooled graph embedding
# right before the final classifier. Compare with exp3_conn_psd (EEG-only) and baseline_age (age-only).
extends: ../exp3_conn_psd.yaml
experiment: exp3_conn_psd_plus_age
covariates: [age]
