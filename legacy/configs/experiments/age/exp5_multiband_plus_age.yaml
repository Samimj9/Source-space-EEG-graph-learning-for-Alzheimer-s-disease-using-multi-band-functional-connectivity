# Age sensitivity analysis (DESIGN.md §5): EEG + age version of exp5_multiband.
# Age is standardized with training-subject statistics inside each fold; classical models
# append it to the EEG feature vector, GNNs concatenate it to the pooled graph embedding
# right before the final classifier. Compare with exp5_multiband (EEG-only) and baseline_age (age-only).
extends: ../exp5_multiband.yaml
experiment: exp5_multiband_plus_age
covariates: [age]
