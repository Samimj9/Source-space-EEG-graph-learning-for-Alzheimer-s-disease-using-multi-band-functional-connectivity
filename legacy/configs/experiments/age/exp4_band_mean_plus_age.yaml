# Age sensitivity analysis (DESIGN.md §5): EEG + age version of exp4_band_mean.
# Age is standardized with training-subject statistics inside each fold; classical models
# append it to the EEG feature vector, GNNs concatenate it to the pooled graph embedding
# right before the final classifier. Compare with exp4_band_mean (EEG-only) and baseline_age (age-only).
extends: ../exp4_band_mean.yaml
experiment: exp4_band_mean_plus_age
covariates: [age]
