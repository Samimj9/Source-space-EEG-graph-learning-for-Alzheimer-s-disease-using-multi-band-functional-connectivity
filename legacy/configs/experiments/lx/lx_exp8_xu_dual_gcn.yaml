# LX Exp 8: Xu-INSPIRED dual-adjacency source-space GCN (src/adgraph/models/xu_dual.py; methodology log entry 52;
# docs/lcmv_xu.md §9). A NEW experiment: the two-layer design of Xu et al. (2025) adapted to OUR representation;
# not a reproduction of Xu's MF-MGCN and not a replacement for Exp 0-7.
#   one graph per Xu band (68 LCMV ROIs);
#   layer 1 = the window's weighted PLV or |ciPLV| (normalized D^-1/2 (A+I) D^-1/2), band-specific weights;
#   layer 2 = FIXED atlas adjacency (same lobe, same hemisphere; cingulate and insula as their own groups),
#             atlas-derived group membership, NOT measured white-matter connectivity;
#   flatten (68 x L x 5) -> FC S -> FC F -> 1 logit. Xu selected K, S and F on their test set (paper Figs. 8-9),
#   so they are NOT used: K = S = F = 32 are our pre-specified fixed-protocol widths (gnn_fixed_base.yaml hidden /
#   mlp_hidden), dropout 0.3 as there; L = 2 is Xu's node-output size (a design value, not tuned in the paper).
# Node-feature variants (our stored features, definitions unchanged):
#   de             [differential entropy]                                 F = 1 (closest to Xu's DE nodes)
#   psd            [log PSD, relative PSD]                                F = 2 (as Exp 3 / 5)
#   psd_de_strength [log PSD, relative PSD, DE, node strength of the band's own adjacency]   F = 4 (primary)
# Ablations (PLV, psd_de_strength): both layers functional; both layers anatomical; bilateral lobes (Xu-like
# grouping); weights shared across bands (as Xu's code). Validation, splits, training-fold-only scaling and
# weights, fixed training schedule and reporting are identical to Exp 0-7.
extends: ../base.yaml
experiment: lx_exp8_xu_dual_gcn
graph_family: LX
settings: [xu_dev_cv, xu_holdout]
input: graph
protocol:
  name: gnn_fixed_hparams_v1
  hyperparameter_search: none
hparams: null
graph:
  connectivity: plv
  bands: [delta, theta, alpha, beta, gamma]
  band_mode: multi
node_features:
  components: [psd, strength]
  psd_kinds: [log, rel, de]
  psd_bands: matched
  scaling: node                  # z-score per (band, ROI, feature), fitted on training windows only
sparsify:
  method: none                   # weighted connectivity kept as is (never binarized)
model:
  architecture: xu_dual_gcn
  encoder: xu_dual_gcn           # display label
  hidden: 32                     # K (fixed protocol hidden width; Xu's 16 was chosen on their test set)
  node_out: 2                    # L (Xu Table 1; not tuned in the paper)
  fc1: 32                        # S (fixed protocol mlp_hidden; Xu's 128 was chosen on their test set)
  fc2: 32                        # F (fixed protocol mlp_hidden; Xu's 32 was chosen on their test set)
  dropout: 0.3                   # fixed protocol dropout, applied after flattening
  band_specific: true
  layer1: functional
  layer2: anatomical
  anatomical_grouping: lobe_hemisphere
training:                        # the fixed GNN schedule of Exp 2-7 (not Xu's batch 10 / 200 epochs)
  lr: 0.001
  weight_decay: 0.0001
  epochs: 60
  batch_size: 32
  early_stopping:
    enabled: false
evaluation: {n_repeats: 1, inner_k: 5, seed: 0, save_model_state: true}
variants:
  plv__psd_de_strength: {graph.connectivity: plv}
  ciplv__psd_de_strength: {graph.connectivity: ciplv}
  plv__psd: {graph.connectivity: plv, node_features.components: [psd], node_features.psd_kinds: [log, rel]}
  ciplv__psd: {graph.connectivity: ciplv, node_features.components: [psd], node_features.psd_kinds: [log, rel]}
  plv__de: {graph.connectivity: plv, node_features.components: [psd], node_features.psd_kinds: [de]}
  ciplv__de: {graph.connectivity: ciplv, node_features.components: [psd], node_features.psd_kinds: [de]}
  plv__psd_de_strength__abl_functional_both: {graph.connectivity: plv, model.layer2: functional}
  plv__psd_de_strength__abl_anatomical_both: {graph.connectivity: plv, model.layer1: anatomical}
  plv__psd_de_strength__abl_bilateral_lobes: {graph.connectivity: plv, model.anatomical_grouping: lobe_bilateral}
  plv__psd_de_strength__abl_shared_weights: {graph.connectivity: plv, model.band_specific: false}
