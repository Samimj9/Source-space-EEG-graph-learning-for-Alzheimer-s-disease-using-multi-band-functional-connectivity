# Controlled atlas comparison (notebook 04; experiments.roi_comparison): dk68 (reference) vs lobes12 (rule-
# recommended) vs r18 (exploratory). The model set and protocol were pre-specified before any result (entry 59);
# lobes12 was added after the exact-BEM resolution result recommended it, r18 is kept as an exploratory arm by the
# author's post-result approval (amendment A1, configs/final/amendments.yaml; methodology log entry 59b).
#
# Same 52 development participants, the same five participant-disjoint folds (xu_dev_cv), window mode B, the same
# training procedures and seeds (the seeds depend on the fold only, never on the atlas), dense weighted PLV for the
# GNNs, GNNs at the fixed 60 epochs. The holdout is NOT evaluated here.
#
# Two kinds of evidence are reported in separate sections and never merged into one score:
#   source localization / spatial resolution  (no labels): ROI-operator rank and forced redundancy, cross-talk and
#                                             own-region dominance of each participant's saved operators against
#                                             the stores' forward model; split-half feature reliability
#   classification (development CV)          participant-level pooled out-of-fold ROC-AUC (DeLong CI), balanced
#                                             accuracy, F1, sensitivity, specificity; paired differences a - b on the
#                                             same participants (paired DeLong; participant bootstrap CIs)
# Every comparison is exploratory and not corrected for multiplicity; the summary is descriptive (`descriptive_rule`)
# and never declares an atlas superior on AUC alone. No atlas is selected here.
atlases: [dk68, lobes12, r18]
reference: dk68
roles:
  dk68: reference (the validated 68-ROI stores)
  lobes12: rule-recommended (exact-BEM atlas_resolution rule)
  r18: exploratory (post-result author approval, amendment A1; fails the LCMV own-region dominance criterion)
comparisons:                    # [a, b]: differences a - b
  - [lobes12, dk68]
  - [r18, dk68]
  - [r18, lobes12]              # descriptive only
inverses: [lcmv, wmne]
mode: B
graph: dense
setting: xu_dev_cv
models:                         # experiment config stem: variants
  exp1_source_psd_de: [logreg__psd, svm__psd, logreg__de, svm__de]
  exp4_band_mean: [plv__psd]
  exp5_multibranch: [plv__separate__mean]
n_bootstrap: 2000
seed: 0
descriptive_rule:               # wording of the classification summary only (no decision is made by code)
  margin: 0.02                  # |mean AUC difference| below this: "no material difference"
  min_fraction_of_cells_same_sign: 0.75
