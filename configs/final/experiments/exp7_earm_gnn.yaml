# Exp 7: EARM-GNN (EEG-guided adaptive residual multiband GNN; src/adgraph/models/earm.py, docs/earm_gnn.md).
# Exploratory: designed after earlier GCN results had been observed (methodology log entry 43).
# EEG adjacency (PLV or |ciPLV|) as the prior of learned, symmetric, low-rank, band-specific edge gates, residual
# encoder blocks shared across bands with a learned band embedding (band identity), attention band fusion; nodes
# [log PSD, relative PSD, strength] per band. Variants: full and the two pre-specified ablations (fixed adjacency,
# mean fusion), each for PLV and |ciPLV|. 6 variants. Training block identical to gnn.yaml (tested).
extends: ../protocol.yaml
experiment: exp7_earm_gnn
input: graph
protocol:
  name: gnn_fixed60_v1
  hyperparameter_search: none
hparams: null
graph:
  connectivity: plv
  bands: [delta, theta, alpha, beta, gamma]
  band_mode: multi
  adjacency: connectivity
node_features:
  components: [psd, strength]
  psd_kinds: [log, rel]
  psd_bands: matched
  scaling: node
model:
  architecture: earm_gnn
  hidden: 32
  n_blocks: 3
  dropout: 0.3
  adaptive_adjacency: true
  gate_rank: 8
  gate_init_bias: 2.0
  gate_l1: 0.01
  band_embedding: true
  pool_hidden: 16
  fusion: attention
  mlp_hidden: 32
training:
  lr: 0.001
  weight_decay: 0.0001
  epochs: 60
  batch_size: 32
evaluation:
  save_model_state: true
sweep:
  graph.connectivity: [plv, ciplv]
variants:
  full: {}
  fixed_adjacency: {model.adaptive_adjacency: false}
  mean_fusion: {model.fusion: mean}
