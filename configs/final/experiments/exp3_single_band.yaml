# Exp 3: single-frequency-band GCN. One band's connectivity + that band's [log, relative] PSD node features
# (F = 2), GCN. 5 bands x {PLV, |ciPLV|} = 10 variants.
extends: ../gnn.yaml
experiment: exp3_single_band
graph:
  band_mode: single
node_features:
  components: [psd]
  psd_kinds: [log, rel]
  psd_bands: matched
sweep:
  graph.connectivity: [plv, ciplv]
  graph.bands: [[delta], [theta], [alpha], [beta], [gamma]]
