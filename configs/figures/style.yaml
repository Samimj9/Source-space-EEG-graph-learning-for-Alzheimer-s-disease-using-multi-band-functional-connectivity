# Central publication style (see src/adgraph/visualization/style.py for defaults).
# Journal column widths in mm; check the target journal's author guidelines.
widths_mm: {single: 85.0, one_half: 120.0, double: 178.0}
max_height_mm: 230.0
font_family: sans-serif
font_size: 7.0
title_size: 8.0
label_size: 7.0
tick_size: 6.0
legend_size: 6.0
line_width: 0.8
axes_line_width: 0.6
marker_size: 3.5
point_size: 2.0
point_alpha: 0.55
dpi: 600                       # PNG resolution
formats: [pdf, svg, png]
sequential_cmap: cividis       # CVD-safe, monotonic lightness (grayscale-readable)
diverging_cmap: RdBu_r         # CVD-safe; limits always symmetric around 0
