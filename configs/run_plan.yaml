# Run plan used by notebooks/02_experiments.ipynb and scripts/run_plan.py.
#
# GNN experiments use the fixed-hyperparameter protocol (configs/experiments/gnn_fixed_base.yaml,
# methodology log entry 42); the nested-CV GNN configs are kept only as historical records.
#
# Order only: it decides what is computed first, never how. Every experiment keeps the settings,
# evaluation protocol and grids of its own config (configs/experiments/, DESIGN.md).
# Pass 1: within-dataset settings (S1/S2, primary in DESIGN.md) for every experiment, primary
#         models first (Exp 0 SVM, Exp 1 SVM, Exp 6 full; docs/figures.md), then the other
#         experiments, baselines and the EEG + age analyses.
# Pass 2: pooled setting (S3, secondary) and the dataset-identity probe.
# Pass 3: cross-dataset settings (S4); run only if the graph run passes the DESIGN.md §7 gate,
#         otherwise recorded as skipped.
experiments:
  # ---- pass 1: within-dataset (primary)
  - {config: configs/experiments/exp0_sensor_psd.yaml, settings: [within_D1, within_D2]}
  - {config: configs/experiments/exp1_source_psd.yaml, settings: [within_D1, within_D2]}
