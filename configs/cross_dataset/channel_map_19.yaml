# Matched 19-electrode representation of D2 (Lebanese 2019 resting state) for the cross-dataset experiment D3 <-> D2
# (docs/cross_dataset/design.md section 3; adgraph.crossdataset.channels; tests/test_cross_channels.py).
#
# The D2 EDFs label their 32 channels by NUMBER only ("Misc ExG1" ... "Misc ExG32"); EDF channel k is electrode k of
# AD-LEB/electrodes_positions_32.loc (EEGLAB polar layout). The layout file is identified by its SHA-256 below: any
# other content refuses the mapping. Every row is verified at run time (adgraph.crossdataset.channels.verify):
#   * the .loc label at `edf_index` is `d2`;
#   * `d2` is `d3` or its documented 10-10 equivalent (T3=T7, T4=T8, T5=P7, T6=P8; identical positions in the
#     colin27 10-05 template used by D3);
#   * the .loc polar direction of `d2` agrees with the D3 template position of `d3` (angle on a sphere fitted to the
#     19 positions), the angle-minimising assignment of the 19 .loc directions to the 19 positions is this table
#     (no swap), and odd-numbered electrodes are on the left, even-numbered on the right;
#   * `mni_mm` are the colin27 10-05 positions (MNE `colin27_1005`, MRI/MNI frame, mm) = the positions stored in
#     every D3 .set file (provider lookup standard_1005.elc; methodology log entry 46).
#
# `canonical_order` is the channel order of the validated D3 stores (configs/source_graphs.yaml channels.recorded);
# the D2 store uses exactly these names in exactly this order, so the sensor-level arrays are aligned row by row.
# The 13 D2 electrodes without a D3 counterpart are never read (selection happens on the EDF header, before any
# filtering, re-referencing or source reconstruction).
version: 1
layout_file: electrodes_positions_32.loc
layout_sha256: da108d022ebdf4565c52d69bc623b50dafbc92d8b2ff9c09aabacd3876e90bd4
layout_n_electrodes: 32
d2_edf_label: "Misc ExG{index}"
template: colin27_1005
frame: mri
equivalences: {T3: T7, T4: T8, T5: P7, T6: P8}
max_angle_deg: 15.0            # .loc direction vs template position (observed 1.4-12.4 deg; idealized sphere vs head)
canonical_order: [Fp1, Fp2, F3, F4, C3, C4, P3, P4, O1, O2, F7, F8, T3, T4, T5, T6, Fz, Cz, Pz]
channels:
  - {d3: Fp1, d2: Fp1, edf_index: 1, edf_label: "Misc ExG1", loc_theta_deg: -18, loc_radius: 0.479, mni_mm: [-29.44, 83.92, -6.99]}
